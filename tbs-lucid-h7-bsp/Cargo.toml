[package]
name = "tbs-lucid-h7-bsp"
description = "Embassy-based board support for the TBS Lucid H7 flight controller"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
icm426xx = { workspace = true, optional = true }
uf-dps3xx = { workspace = true, optional = true }
embassy-stm32 = { workspace = true, features = [
  "stm32h743zi",
  "time-driver-tim12",
  "exti",
] }
embassy-usb = { workspace = true }
stm32-metapac = { workspace = true }
uf-bsp-core = { workspace = true }

[features]
sensor-examples = ["dep:icm426xx", "dep:uf-dps3xx"]

[dev-dependencies]
heapless = "0.9.3"
cortex-m = { version = "0.7.6", features = [
  "inline-asm",
  "critical-section-single-core",
] }
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-hal-bus = { workspace = true }
panic-halt = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true }

[[example]]
name = "imu_spi"
required-features = ["sensor-examples"]

[[example]]
name = "baro_i2c"
required-features = ["sensor-examples"]

[package.metadata.docs.rs]
default-target = "thumbv7em-none-eabihf"
targets = ["thumbv7em-none-eabihf"]
all-features = true
