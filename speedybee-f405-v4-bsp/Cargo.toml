[package]
name = "speedybee-f405-v4-bsp"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
embassy-time = { workspace = true, optional = true }
embedded-hal-bus = { workspace = true, optional = true }
icm426xx = { workspace = true, optional = true }
uf-dps3xx = { workspace = true, optional = true }
embassy-stm32 = { workspace = true, features = [
  "stm32f405rg",
  "time-driver-tim9",
  "exti",
] }
embassy-usb = { workspace = true }
embassy-usb-logger = "0.6.0"
log = "0.4"
static_cell = "2.1.1"
stm32-metapac = { workspace = true }
uf-bsp-core = { workspace = true }

[features]
self-test = ["uf-bsp-core/self-test", "dep:embassy-time", "dep:embedded-hal-bus"]
sensor-examples = ["dep:icm426xx", "dep:uf-dps3xx"]

[dev-dependencies]
cortex-m = { version = "0.7.6", features = [
  "inline-asm",
  "critical-section-single-core",
] }
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true }
embedded-hal-bus = { workspace = true }
embedded-hal-async = { workspace = true }
panic-halt = { workspace = true }

[[example]]
name = "self_check"
required-features = ["self-test"]

[[example]]
name = "imu_spi"
required-features = ["sensor-examples"]

[[example]]
name = "baro_i2c"
required-features = ["sensor-examples"]
