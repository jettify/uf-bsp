[package]
name = "uf-bsp-core"
description = "Shared hardware metadata, interrupt latches, USB helpers, and diagnostics for uf-bsp board support crates"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
self-test = ["dep:embedded-hal", "dep:embedded-hal-async", "dep:embassy-time", "dep:embassy-futures", "dep:heapless"]

[dependencies]
embedded-hal = { version = "1.0", optional = true }
embedded-hal-async = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
heapless = { version = "0.9.3", optional = true }
embassy-sync = { workspace = true }
embassy-usb = { workspace = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
