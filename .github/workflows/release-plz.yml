name: Release-plz

on:
  push:
    branches:
      - master

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'jettify/uf-bsp' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy
      - name: Install Just
        uses: taiki-e/install-action@just
      - name: Verify release
        run: just ci
      - name: Install release tools for the runner
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.4.3,cargo-semver-checks@0.51
      - name: Configure release commit identity
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Run release-plz
        run: release-plz release --git-token "$GITHUB_TOKEN" --forge github
        env:
          CARGO_BUILD_TARGET: thumbv7em-none-eabihf
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'jettify/uf-bsp' }}
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Install release tools for the runner
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.4.3,cargo-semver-checks@0.51
      - name: Configure release commit identity
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Run release-plz
        run: >-
          release-plz release-pr --git-token "$GITHUB_TOKEN" --forge github
          --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        env:
          CARGO_BUILD_TARGET: thumbv7em-none-eabihf
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
