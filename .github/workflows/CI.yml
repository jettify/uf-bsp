name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Embassy toolchain (Rust 1.92.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.92.0"
          target: thumbv7em-none-eabihf
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install Just
        uses: taiki-e/install-action@just
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: CI
        run: just ci
      - name: Release checks
        run: just release-checks
      - name: Generate code coverage
        run: just cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  stable:
    name: Current stable compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
      - name: Test core
        run: cargo +stable test -p uf-bsp-core --all-features --locked
      - name: Check board libraries and examples separately
        run: |
          cargo +stable check -p tbs-lucid-h7-bsp --target thumbv7em-none-eabihf --all-features --lib --examples --locked
          cargo +stable check -p speedybee-f405-v4-bsp --target thumbv7em-none-eabihf --all-features --lib --examples --locked
